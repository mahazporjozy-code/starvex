name: STARVEX CI Diagnostics

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starvex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python checks with diagnostic report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run checks and capture exact diagnostics
        id: checks
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > diagnostics.txt

          echo "=== Python syntax check ===" | tee -a diagnostics.txt
          python -m compileall -q bot.py >> diagnostics.txt 2>&1
          syntax_status=$?
          echo "Python syntax exit code: ${syntax_status}" | tee -a diagnostics.txt

          echo "" | tee -a diagnostics.txt
          echo "=== Unit tests ===" | tee -a diagnostics.txt
          if [ -d tests ]; then
            python -m unittest discover -s tests -p "test_*.py" -v >> diagnostics.txt 2>&1
            tests_status=$?
          else
            echo "No tests/ directory exists on this revision; unit tests were not available." | tee -a diagnostics.txt
            tests_status=0
          fi
          echo "Unit test exit code: ${tests_status}" | tee -a diagnostics.txt

          echo "syntax_status=${syntax_status}" >> "$GITHUB_OUTPUT"
          echo "tests_status=${tests_status}" >> "$GITHUB_OUTPUT"

          cat diagnostics.txt
          if [ "${syntax_status}" -ne 0 ] || [ "${tests_status}" -ne 0 ]; then
            exit 1
          fi

      - name: Publish diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starvex-diagnostics-${{ github.run_number }}
          path: diagnostics.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Add diagnostic summary
        if: always()
        env:
          SYNTAX_STATUS: ${{ steps.checks.outputs.syntax_status }}
          TESTS_STATUS: ${{ steps.checks.outputs.tests_status }}
        run: |
          {
            echo "## STARVEX automated diagnostics"
            echo ""
            echo "- Python syntax exit code: ${SYNTAX_STATUS:-not reported}"
            echo "- Unit test exit code: ${TESTS_STATUS:-not reported}"
            echo "- Detailed output: downloadable workflow artifact `starvex-diagnostics-${{ github.run_number }}`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark workflow failed when checks fail
        if: always()
        env:
          SYNTAX_STATUS: ${{ steps.checks.outputs.syntax_status }}
          TESTS_STATUS: ${{ steps.checks.outputs.tests_status }}
        run: |
          if [ "${SYNTAX_STATUS:-1}" -ne 0 ] || [ "${TESTS_STATUS:-1}" -ne 0 ]; then
            echo "One or more checks failed. See the diagnostic artifact and workflow summary."
            exit 1
          fi
