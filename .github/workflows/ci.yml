name: STARVEX CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starvex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q bot.py

      - name: Run unit tests when present
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -p "test_*.py" -v
          else
            echo "No tests/ directory exists on this revision; skipping unit-test discovery."
          fi
