name: STARVEX CI PR Reporter

on:
  workflow_run:
    workflows: ["STARVEX CI Diagnostics"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish diagnostics without checking out PR code
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const marker = '<!-- starvex-ci-diagnostics:v2 -->';
            const prs = run.pull_requests || [];
            const pr = prs.find(item =>
              item.head?.sha === run.head_sha &&
              item.head?.repo?.full_name === context.repo.owner + '/' + context.repo.repo &&
              item.base?.ref === 'main'
            );

            if (!pr) {
              core.info('No matching same-repository PR was attached to this workflow run; no comment posted.');
              return;
            }

            const passed = run.conclusion === 'success';
            const body = [
              marker,
              '## STARVEX automated diagnostics',
              '',
              passed ? '**Result: checks passed.**' : '**Result: checks need attention.**',
              '',
              `- Workflow result: ${run.conclusion || 'unknown'}`,
              `- Commit: \`${run.head_sha}\``,
              `- [Open the full Actions run and diagnostic artifact](${run.html_url})`,
              '',
              'This report comes from the completed GitHub Actions run. The reporter does not check out, execute, or modify pull-request code.'
            ].join('\\n');

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body
              });
            }
